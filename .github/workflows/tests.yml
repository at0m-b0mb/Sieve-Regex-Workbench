name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The GUI tests drive real widgets offscreen, which needs the X libraries
      # PyQt links against even when nothing is ever displayed.
      - name: Install Qt's runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 \
            libdbus-1-3 libxrandr2 libxss1 libasound2t64 || \
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Prove the shipped example patterns
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          for f in patterns/*.sieve; do
            echo "== $f"
            python -m sieve test "$f"
          done
