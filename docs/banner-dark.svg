<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420"
     width="1280" height="420" role="img"
     aria-label="Sieve — a regex workbench for security work">
  <title>Sieve</title>
  <desc>The Sieve wordmark: a mesh bowl with two grains falling through it and
  one held back, above the word SIEVE and the line "a regex workbench for
  security work".</desc>

  <rect width="1280" height="420" fill="#000000"/>
  <circle cx="96" cy="128" r="3.0" fill="#D9B75C" opacity="0.22"/><circle cx="168" cy="250" r="2.2" fill="#D9B75C" opacity="0.16"/><circle cx="60" cy="300" r="2.6" fill="#D9B75C" opacity="0.12"/><circle cx="210" cy="92" r="2.0" fill="#D9B75C" opacity="0.14"/><circle cx="132" cy="344" r="1.8" fill="#D9B75C" opacity="0.1"/><circle cx="1184" cy="132" r="3.0" fill="#D9B75C" opacity="0.22"/><circle cx="1112" cy="262" r="2.2" fill="#D9B75C" opacity="0.16"/><circle cx="1220" cy="308" r="2.6" fill="#D9B75C" opacity="0.12"/><circle cx="1070" cy="96" r="2.0" fill="#D9B75C" opacity="0.14"/><circle cx="1148" cy="350" r="1.8" fill="#D9B75C" opacity="0.1"/>

  <!-- a hairline frame, inset -->
  <rect x="28" y="28" width="1224" height="364" fill="none"
        stroke="#2B2B28" stroke-width="1"/>

  
  <g>
    <clipPath id="bowl"><path d="M603.52,122.64 L676.48,122.64 C676.48,161.04 655.36,174.48 640.00,174.48 C624.64,174.48 603.52,161.04 603.52,122.64 Z"/></clipPath>
    <g clip-path="url(#bowl)" stroke="#D9B75C" stroke-width="1.10"
       opacity="0.9">
      <line x1="601.60" y1="130.90" x2="678.40" y2="130.90"/><line x1="601.60" y1="139.15" x2="678.40" y2="139.15"/><line x1="601.60" y1="147.41" x2="678.40" y2="147.41"/><line x1="601.60" y1="155.66" x2="678.40" y2="155.66"/><line x1="601.60" y1="163.92" x2="678.40" y2="163.92"/><line x1="601.60" y1="172.18" x2="678.40" y2="172.18"/><line x1="611.78" y1="120.72" x2="611.78" y2="176.40"/><line x1="620.03" y1="120.72" x2="620.03" y2="176.40"/><line x1="628.29" y1="120.72" x2="628.29" y2="176.40"/><line x1="636.54" y1="120.72" x2="636.54" y2="176.40"/><line x1="644.80" y1="120.72" x2="644.80" y2="176.40"/><line x1="653.06" y1="120.72" x2="653.06" y2="176.40"/><line x1="661.31" y1="120.72" x2="661.31" y2="176.40"/><line x1="669.57" y1="120.72" x2="669.57" y2="176.40"/>
    </g>
    <path d="M603.52,122.64 L676.48,122.64 C676.48,161.04 655.36,174.48 640.00,174.48 C624.64,174.48 603.52,161.04 603.52,122.64 Z" fill="none" stroke="#D9B75C"
          stroke-width="2.30" stroke-linejoin="round"/>
    <circle cx="640.00" cy="128.40" r="4.80" fill="#F1C84B"/>
    <circle cx="627.52" cy="183.12" r="2.50" fill="#F3F0E9" opacity="0.5"/>
    <circle cx="652.48" cy="186.96" r="1.92" fill="#F3F0E9" opacity="0.28"/>
  </g>

  <text x="640.0" y="264" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="68" font-weight="600" letter-spacing="18"
        fill="#F3F0E9">SIEVE</text>

  <line x1="530.0" y1="292" x2="750.0" y2="292"
        stroke="#F1C84B" stroke-width="1.5"/>

  <text x="640.0" y="326" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="16" letter-spacing="3.2" fill="#A29C91">
    A REGEX WORKBENCH FOR SECURITY WORK
  </text>

  <text x="640.0" y="364" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="11.5" letter-spacing="4.5" fill="#6B675F">
